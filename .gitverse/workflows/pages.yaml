name: GitVerse Pages Static Export

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: adjectivebloom-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Build static site
        run: npx next build

      - name: Verify exported game
        run: |
          set -eux
          test -f out/index.html
          test -f out/desk-background.webp
          test -f out/envelope-fern-closed-opt.webp
          test -f out/envelope-fern-open-opt.webp
          test -f out/pressed-ferns.mp3
          test -f out/quill-cursor.png
          test -d out/photos-webp
          test -d out/growth-stages
          test "$(find out/photos-webp -maxdepth 1 -type f -name '*.webp' | wc -l)" -eq 14
          test "$(find out/growth-stages -maxdepth 1 -type f -name '*.webp' | wc -l)" -ge 9
          grep -R -q '/adjectivebloom/photos-webp/confident.webp' out
          grep -R -q '/adjectivebloom/desk-background.webp' out
          if grep -R -q '/adjectivebloom/adjectivebloom/' out; then
            echo 'ERROR: double basePath found in export'
            grep -R -n '/adjectivebloom/adjectivebloom/' out | head -20
            exit 1
          fi
          echo 'Static export verified: all game assets and paths are present.'

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v1
        with:
          path: './out'

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '>=1.23'

      - name: Deploy to GitVerse Pages
        id: deployment
        uses: actions/deploy-pages@v1
        with:
          artifact_name: gitverse-pages

      - name: Print deploy URL
        run: echo "page_url = ${{ steps.deployment.outputs.page_url }}"
