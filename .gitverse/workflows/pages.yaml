name: GitVerse Pages Static Export

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Build static site
        run: npx next build

      - name: Verify static entrypoint
        run: |
          test -f out/index.html
          echo "Publishing index.html at artifact root"
          find out -maxdepth 2 -type f | head -40

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v1
        with:
          path: './out'

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '>=1.23'

      - name: Deploy to GitVerse Pages
        id: deployment
        uses: actions/deploy-pages@v1
        with:
          artifact_name: gitverse-pages

      - name: Print deploy URL
        run: echo "page_url = ${{ steps.deployment.outputs.page_url }}"
