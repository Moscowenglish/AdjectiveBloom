name: GitVerse Pages Static Export

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Build static site
        run: npx next build

      - name: Prepare GitVerse project path
        run: |
          find out -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' \) -print0 | \
            xargs -0 sed -i \
              -e 's#"/photos-webp/#"/adjectivebloom/photos-webp/#g' \
              -e 's#"/growth-stages/#"/adjectivebloom/growth-stages/#g' \
              -e 's#"/desk-background.webp"#"/adjectivebloom/desk-background.webp"#g' \
              -e 's#"/envelope-fern-closed-opt.webp"#"/adjectivebloom/envelope-fern-closed-opt.webp"#g' \
              -e 's#"/envelope-fern-open-opt.webp"#"/adjectivebloom/envelope-fern-open-opt.webp"#g' \
              -e 's#"/pressed-ferns.mp3"#"/adjectivebloom/pressed-ferns.mp3"#g' \
              -e 's#"/quill-cursor.png"#"/adjectivebloom/quill-cursor.png"#g'
          mkdir -p publish/adjectivebloom
          cp -a out/. publish/adjectivebloom/

      - name: Verify static entrypoint
        run: test -f publish/adjectivebloom/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v1
        with:
          path: './publish'

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '>=1.23'

      - name: Deploy to GitVerse Pages
        id: deployment
        uses: actions/deploy-pages@v1
        with:
          artifact_name: gitverse-pages

      - name: Print deploy URL
        run: echo "page_url = ${{ steps.deployment.outputs.page_url }}"
