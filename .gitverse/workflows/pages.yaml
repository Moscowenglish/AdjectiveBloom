name: GitVerse Pages Static Export

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Build static site
        run: npx next build

      - name: Verify static entrypoint
        run: |
          test -f out/index.html
          echo "Static export ready:"
          ls -la out | head -50

      - name: Upload pages artifact
        uses: gitverse/upload-pages-artifact@v1.0.0
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitVerse Pages
        id: deployment
        uses: gitverse/deploy-pages@v1.0.0

      - name: Print deploy URL
        run: echo "page_url = ${{ steps.deployment.outputs.page_url }}"
